```html
<div class="rf-event-tools" id="year-buttons" aria-label="Event years"></div>

<div class="rf-events" id="events"></div>

<p class="rf-center" id="archive-note" style="color:#777;margin-top:30px">
    Explore our journey starting from 1998.
</p>

<script>
(function () {
    const years = Array.from(
        { length: 2025 - 1998 + 1 },
        (_, i) => 2025 - i
    );

    const photos = [
        {
            url: "https://images.unsplash.com/photo-1509062522246-3755977927d7?auto=format&fit=crop&w=900&q=80",
            search: "education classroom children"
        },
        {
            url: "https://images.unsplash.com/photo-1529390079861-591de354faf5?auto=format&fit=crop&w=900&q=80",
            search: "community education volunteering"
        },
        {
            url: "https://images.unsplash.com/photo-1517486808906-6ca8b3f04846?auto=format&fit=crop&w=900&q=80",
            search: "community volunteers"
        },
        {
            url: "https://images.unsplash.com/photo-1503676260728-1c00da094a0b?auto=format&fit=crop&w=900&q=80",
            search: "students learning"
        },
        {
            url: "https://images.unsplash.com/photo-1531206715517-5c0ba140b2b8?auto=format&fit=crop&w=900&q=80",
            search: "nonprofit community teamwork"
        }
    ];

    const buttons = document.getElementById("year-buttons");
    const events = document.getElementById("events");
    const note = document.getElementById("archive-note");

    years.forEach((year, index) => {
        const button = document.createElement("button");
        button.className = "rf-year" + (year === 1998 ? " active" : "");
        button.textContent = year;
        button.dataset.year = year;

        button.addEventListener("click", () => {
            buttons.querySelectorAll(".rf-year").forEach(btn => {
                btn.classList.toggle("active", btn === button);
            });

            events.querySelectorAll(".rf-event").forEach(card => {
                card.hidden = card.dataset.years !== String(year);
            });

            note.textContent = "Showing the archive for " + year + ".";
        });

        buttons.appendChild(button);

        const photo = photos[index % photos.length];
        const googleLink =
            "https://www.google.com/search?tbm=isch&q=" +
            encodeURIComponent(photo.search);

        const card = document.createElement("article");
        card.className = "rf-event rf-reveal";
        card.dataset.years = year;
        card.hidden = year !== 1998;

        const imageLink = document.createElement("a");
        imageLink.href = googleLink;
        imageLink.target = "_blank";
        imageLink.rel = "noopener noreferrer";

        const image = document.createElement("img");
        image.src = photo.url;
        image.alt = "Illustrative education and community image for " + year;
        image.loading = "lazy";

        imageLink.appendChild(image);

        const body = document.createElement("div");
        body.className = "rf-event-body";

        const date = document.createElement("div");
        date.className = "date";
        date.textContent = year;

        const heading = document.createElement("h3");
        heading.textContent = year === 1998
            ? "Our Journey Begins"
            : "Education & Community Initiatives";

        const description = document.createElement("p");
        description.textContent = year === 1998
            ? "Our journey begins in 1998. Add verified milestones and original photographs here."
            : "Explore education, awareness and community development activities. Add verified events and photographs for this year.";

        const link = document.createElement("a");
        link.className = "rf-link";
        link.href = googleLink;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.textContent = "Find Images on Google »";

        body.append(date, heading, description, link);
        card.append(imageLink, body);
        events.appendChild(card);
    });
})();
</script>
```
